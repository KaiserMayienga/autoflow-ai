# Local, self-hosted stack. Qdrant/Redis/Ollama are started now but only wired in Phase 2.
services:
  agent:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [qdrant, redis]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  qdrant_data:
  ollama_data:
